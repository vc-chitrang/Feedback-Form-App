<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Visitor Feedback</title>
    <style>
      :root { --bg: #fafaf9; --card: #fff; --ink: #1c1917; --muted: #57534e; --brand: #7a1f2b; --line: #e7e5e4; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #1c1917; --card: #292524; --ink: #fafaf9; --muted: #a8a29e; --line: #44403c; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      main { width: 100%; max-width: 560px; }
      h1 { font: 600 2rem/1.2 Georgia, serif; margin: 0 0 8px; }
      p { color: var(--muted); margin: 0 0 24px; }
      a.card { display: block; padding: 20px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: inherit; text-decoration: none; }
      a.card:hover { border-color: var(--brand); }
      a.card strong { display: block; font-size: 1.1rem; }
      a.card span { color: var(--muted); font-size: 0.95rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Visitor Feedback</h1>
      <p>White-label feedback forms for museums and venues.</p>
      <a class="card" href="./admin/"><strong>Admin app →</strong><span>Build the form, publish versions, see responses.</span></a>
      <a class="card" href="./client/"><strong>Kiosk app →</strong><span>Tablet kiosk (pair with a code from Admin → Devices).</span></a>
      <a class="card" href="./client/?f=demo-museum"><strong>Visitor form (QR) →</strong><span>The form as visitors see it on their phone.</span></a>
    </main>
  </body>
</html>
